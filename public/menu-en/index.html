<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Menu · Rạng Đông</title>
<meta name="description" content="Menu Rạng Đông – Japanese & Vietnamese Cuisine">
<style>
:root{--bg:#f4ead3;--ink:#3c220a;--gold:#b8872e}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Georgia,serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:#fffaf0ee;backdrop-filter:blur(6px);border-bottom:1px solid #d9b866;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
header b{font-size:17px;letter-spacing:.04em}
header a{color:#fff;background:#a8201a;text-decoration:none;font:600 13px/1 system-ui,sans-serif;padding:9px 13px;border-radius:999px;white-space:nowrap}
nav{display:flex;gap:8px;overflow-x:auto;padding:8px 12px;background:#fffaf0;border-bottom:1px solid #ead9a8;position:sticky;top:53px;z-index:4;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;border:1px solid #d9b866;background:#fff;color:var(--ink);font:600 13px/1 system-ui,sans-serif;padding:8px 12px;border-radius:999px}
main{max-width:760px;margin:0 auto;padding:10px 8px 40px}
.pg{display:block;width:100%;height:auto;aspect-ratio:595/842;background:#fbf3df;margin:0 0 10px;border-radius:4px;box-shadow:0 2px 10px #0003}
.n{text-align:center;font:12px system-ui,sans-serif;color:#7a5a2a;margin:-4px 0 14px}
</style></head><body>
<header><b>Rạng Đông · Menu</b><a href="tel:+493046902659">Call us</a></header>
<nav id="nav"></nav>
<main id="m"></main>
<script>
var N=44,S=[["Cover",1],["Starters",2],["Main Courses",5],["Sushi",13],["Drinks",25],["Món Việt",33],["Feast",40]];
var m=document.getElementById("m"),nav=document.getElementById("nav");
for(var i=1;i<=N;i++){var id="p"+i,n=("0"+i).slice(-2);
 var im=new Image();im.className="pg";im.id=id;im.alt="Page "+i;im.decoding="async";
 if(i<=2)im.src="/menu-en/p"+n+".webp";else{im.loading="lazy";im.src="/menu-en/p"+n+".webp"}
 m.appendChild(im);var t=document.createElement("div");t.className="n";t.textContent=i+" / "+N;m.appendChild(t)}
S.forEach(function(s){var b=document.createElement("button");b.textContent=s[0];b.onclick=function(){document.getElementById("p"+s[1]).scrollIntoView({behavior:"smooth"})};nav.appendChild(b)});
</script></body></html>
